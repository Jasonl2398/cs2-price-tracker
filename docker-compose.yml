services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cs2tracker-backend
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
    ports:
      - "3001:3001"
    networks:
      -  cs2tracker-net
    healthcheck:
      test: ["CMD", "wget", "-q0", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfole: Dockerfile.frontend
    container_name: cs2tracker-frontend
    restart: unless-stopped
    ports:
      - "80:80" #http
    depends_on:
      backend:
        condition: service_healthy
    networks:
      -  cs2tracker-net
      
networks:
  cs2tracker-net:
    driver: bridge